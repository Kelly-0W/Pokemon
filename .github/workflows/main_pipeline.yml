name: Pokemon ETL Pipeline

on:
  push:
    branches: [ main ]  # Roda toda vez que você enviar código para a branch main
  schedule:
    - cron: '0 0 * * 0' # Roda automaticamente todo domingo à meia-noite (opcional)

jobs:
  build:
    runs-on: ubuntu-latest # O GitHub vai abrir um computador com Linux para nós

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3 # Baixa seu código do GitHub para esse PC temporário

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests openpyxl

    - name: Rodar Coletor de Dados
      run: python scripts/colector.py

    - name: Salvar Mudanças no Repositório
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add data/base_pokemon.xlsx
        git commit -m "Auto-update: Base de Dados Pokemon" || echo "Sem mudanças para salvar"
        git push