name: Pokemon ETL Pipeline

on:
  push:
    branches: [ main ]  
  schedule:
    - cron: '0 0 * * 0' 
jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3 

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests openpyxl

    - name: Rodar Coletor de Dados
      run: python scripts/colector.py

    - name: Salvar Mudanças no Repositório
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add data/base_pokemon.xlsx
        git commit -m "Auto-update: Base de Dados Pokemon" || echo "Sem mudanças para salvar"
        git push